<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="map-updated" content="2026-11-06">
<meta name="theme-color" content="#101c27">
<meta name="description" content="A day-by-day, phone-friendly map of FOCS and TCC at NYU Kimmel Center and Warren Weaver Hall.">
<title>Kimmel · Find your floor</title>
<link rel="stylesheet" href="style.css?v=92a4c923ac">
<link rel="stylesheet" href="map.css?v=0e5d6cf3f6">
<link rel="stylesheet" href="program.css?v=00f80a8624">
<link rel="stylesheet" href="neighborhood.css?v=f19f3e8f7b">
<link rel="stylesheet" href="venue-flight.css?v=b2e6f921eb">
</head>
<body data-style="pixel">
<div class="app">
  <header>
    <div class="top-row">
      <div class="brand"><span class="brand-mark" aria-hidden="true">k.</span><span>FOCS × TCC 2026</span></div>
      <label class="mood-control" for="mood-selector"><span>Mood</span><select id="mood-selector" class="mood-select"><option value="auto" selected>Automatic · day / night</option><option value="soft">Soft daylight</option><option value="pixel">Nightstalgic</option><option value="kawaii">Kawaii</option><option value="hacker">Hacker</option><option value="apocalypse">AI-pocalypse</option></select></label>
    </div>
    <h1>Find your floor.</h1>
    <p class="address">Kimmel Center · 60 Washington Square South</p>
  </header>
  <nav class="app-tabs" role="tablist" aria-label="Conference guide">
    <button type="button" id="map-tab" class="app-tab" role="tab" aria-controls="map-view" aria-selected="true">Find your floor</button>
    <button type="button" id="session-tab" class="app-tab" role="tab" aria-controls="program-view" aria-selected="false">Find your session</button>
  </nav>
  <nav class="days" aria-label="Conference day" id="days"></nav>
  <div class="day-heading"><h2 id="day-title"></h2><span class="conference-tag" id="conference-tag"></span><span id="conference-clock" class="conference-clock"></span></div>
  <section id="map-view" role="tabpanel" aria-labelledby="map-tab">
  <main>
    <section class="building-panel" aria-labelledby="building-title">
      <div class="section-heading"><h2 id="building-title">Open a floor</h2><span class="hint">Tap a floor</span></div>
      <div class="floor-selector" id="floor-selector" aria-label="Select floor"></div>
      <div id="building" class="building"></div>
      <div class="room-list" id="room-list" aria-label="Rooms on this floor"></div>
      <div class="selection" aria-live="polite" aria-atomic="true"><span class="selection-dot" id="selection-dot"></span><div><h3 id="selection-title"></h3><p id="selection-description"></p></div></div>
    </section>
    <section class="detail-panel" aria-labelledby="floor-title">
      <div class="section-heading"><div><p class="eyebrow" id="floor-kicker"></p><h2 id="floor-title"></h2></div><span class="north" aria-label="North is up">↑ N</span></div>
      <div class="plan-wrap" id="floor-plan"></div>
      <p id="venue-source-note" class="venue-source-note"></p>
    </section>
  </main>
  <p class="day-note" id="day-note"></p>
  <section class="neighborhood-panel" aria-labelledby="neighborhood-title">
    <div class="neighborhood-heading"><h2 id="neighborhood-title">Around the venues</h2><span>Pan ↔</span></div>
    <div id="neighborhood-map" class="neighborhood-viewport" tabindex="0" role="region" aria-label="Neighborhood map; scroll sideways for the full block"></div>
    <p class="neighborhood-caption"><span>Kimmel → Bobst → Gould Plaza → WWH</span><span>Schematic · <a href="https://nyu.cloud.vicinia.io/map" target="_blank" rel="noopener">NYU campus map ↗</a></span></p>
  </section>
  </section>
  <section id="program-view" class="program-view" role="tabpanel" aria-labelledby="session-tab" hidden>
    <div id="program-app"><p class="program-loading" role="status">Loading the program…</p></div>
  </section>
  <footer>
    <p id="map-footer-note">Schematic illustration · Not to scale</p>
    <p><a href="https://focs.computer.org/2026/main-program/" target="_blank" rel="noopener">FOCS program ↗</a></p>
  </footer>
</div>
<script src="neighborhood.js?v=b03c56cd8b"></script>
<script src="venue-flight.js?v=3c7ddb44fd"></script>
<script src="app.js?v=04230939fb"></script>
<script src="moods.js?v=ffe82302a3"></script>
<script src="program.js?v=d151583371"></script>
</body>
</html>
